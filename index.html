<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نيكست</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نيكست">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --grid: rgba(255,255,255,.045);
    --fg: #f4f4f6;
    --muted: #8b8b96;
    --line: #23232b;
    --card: #0d0d12;
    --pink: #ff3d8b;
    --indigo: #5b5bff;
    --ok: #3ddc97;
    --warn: #ffb547;
    --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--fg);
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 560px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--pink), var(--indigo));
    display: grid; place-items: center; font-size: 15px; font-weight: 700; color: #fff;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  .status { margin-top: 6px; font-size: 13px; color: var(--muted); min-height: 18px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.busy { background: var(--warn); }
  .dot.err { background: var(--err); }

  .stage { flex: none; display: grid; place-items: center; padding: 18px 0 8px; }
  .orb {
    width: 168px; height: 168px; border-radius: 50%;
    border: none; cursor: pointer; position: relative; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff7ab0 0%, var(--pink) 35%, var(--indigo) 100%);
    box-shadow: 0 0 calc(30px + var(--lvl, 0) * 70px) rgba(255, 61, 139, calc(.25 + var(--lvl, 0) * .5));
    transform: scale(calc(1 + var(--lvl, 0) * .08));
    transition: transform .08s linear, box-shadow .08s linear, filter .2s;
    font: 700 19px "IBM Plex Sans Arabic", sans-serif;
  }
  .orb.idle { filter: saturate(.55) brightness(.8); }
  .orb.speaking { background: radial-gradient(circle at 35% 30%, #9a9aff 0%, var(--indigo) 40%, var(--pink) 100%); }
  .orb:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .meta { margin-top: 14px; display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .pill {
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    padding: 9px 16px; border-radius: 999px; font: 500 14px "IBM Plex Sans Arabic", sans-serif; cursor: pointer;
  }
  .pill.on { border-color: var(--warn); color: var(--warn); }
  .pill[hidden] { display: none; }

  .log {
    flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px;
    display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px;
  }
  .msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-start; background: #1a1a22; border: 1px solid var(--line); }
  .msg.next { align-self: flex-end; background: linear-gradient(135deg, rgba(255,61,139,.16), rgba(91,91,255,.16)); border: 1px solid rgba(255,61,139,.25); }
  .msg.tool { align-self: center; font-size: 12px; color: var(--muted); background: none; padding: 2px 8px; }
  .msg.sys { align-self: center; font-size: 13px; color: var(--warn); background: none; text-align: center; }

  .composer { display: flex; gap: 8px; margin-top: 8px; }
  .composer input {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--fg);
    border-radius: 12px; padding: 11px 12px; font: 15px "IBM Plex Sans Arabic", sans-serif;
  }
  .composer button { flex: none; }

  dialog {
    background: #0b0b10; color: var(--fg); border: 1px solid var(--line); border-radius: 18px;
    width: min(520px, calc(100vw - 32px)); padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  dialog p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  dialog input, dialog select {
    width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--fg);
    border-radius: 10px; padding: 10px 12px; font: 14px "IBM Plex Sans Arabic", sans-serif; direction: ltr; text-align: left;
  }
  dialog select { direction: rtl; text-align: right; }
  .row { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .primary { background: linear-gradient(135deg, var(--pink), var(--indigo)); border: none; color: #fff; }
  .check { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    padding: 7px 12px; border-radius: 999px; font: 500 13px "IBM Plex Sans Arabic", sans-serif; cursor: pointer;
  }
  .chip[aria-pressed="true"] { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--pink), var(--indigo)); }
  .add-lang { display: flex; gap: 8px; margin-top: 8px; }
  dialog .add-lang input { direction: rtl; text-align: right; }
  .add-lang .pill { flex: none; }
  .lock-screen {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
  }
  .lock-screen .mark.big {
    width: 72px; height: 72px; border-radius: 20px; font-size: 34px; font-weight: 700; color: #fff;
    display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), var(--indigo));
  }
  .lock-title { font-size: 20px; font-weight: 700; }
  .lock-screen .check { color: var(--err); text-align: center; }
  .link { background: none; border: none; color: var(--muted); font: 13px "IBM Plex Sans Arabic", sans-serif; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">N</span>نيكست</div>
    <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">⚙︎</button>
  </header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">جاهز</span></div>

  <div class="stage">
    <button class="orb idle" id="orb" aria-label="ابدأ المكالمة">اتصل</button>
    <div class="meta">
      <span id="timer">00:00</span>
      <span id="cost">هذا الشهر: 0 د</span>
    </div>
    <div class="controls">
      <button class="pill" id="muteBtn" hidden>كتم المايك</button>
      <button class="pill" id="endBtn" hidden>إنهاء</button>
    </div>
  </div>

  <div class="log" id="log" aria-live="polite"></div>

  <form class="composer" id="composer" hidden>
    <input id="textInput" placeholder="أو اكتب هنا…" autocomplete="off">
    <button class="pill" type="submit">إرسال</button>
  </form>
</div>

<div class="lock-screen" id="lockScreen" hidden>
  <div class="mark big">N</div>
  <div class="lock-title">نيكست مقفل</div>
  <button class="pill primary" id="unlockBtn">افتح بـ Face ID</button>
  <div class="check" id="lockError"></div>
  <button class="link" id="lockReset">لا يعمل؟ امسح المفاتيح وأدخلها من جديد</button>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>الإعدادات</h2>
    <p class="hint">تُحفظ على هذا الجهاز فقط ولا تُرسل إلا إلى Google (المفتاح) وGitHub (الرمز).</p>
    <label for="sKey">مفتاح Gemini API</label>
    <input id="sKey" type="password" autocomplete="off" spellcheck="false">
    <label for="sToken">رمز GitHub (Fine-grained — مستودع الـ Vault فقط)</label>
    <input id="sToken" type="password" autocomplete="off" spellcheck="false">
    <label for="sRepo">مستودع الـ Vault (owner/name)</label>
    <input id="sRepo" placeholder="elwalidhafiz-svg/My-Vault" autocomplete="off" spellcheck="false">
    <label for="sVoice">الصوت</label>
    <select id="sVoice"></select>
    <label id="sLangsLabel">اللغات التي تتكلم بها</label>
    <div class="chips" id="sLangs" role="group" aria-labelledby="sLangsLabel"></div>
    <div class="add-lang">
      <input id="sLangNew" placeholder="لغة أخرى…" autocomplete="off">
      <button class="pill" type="button" id="sLangAdd">إضافة</button>
    </div>
    <label>المقاطعة أثناء كلامه</label>
    <div class="lock-row"><button class="pill" type="button" id="bargeToggle">مفعّلة</button></div>
    <div class="check">أطفئها في السيارة أو على السبيكر إن كان يسمع صوته ويقاطع نفسه.</div>
    <label>فحص اكتمال المهام</label>
    <div class="lock-row"><button class="pill" type="button" id="taskCheckToggle">مفعّل</button></div>
    <div class="check">عند سرد مهام اليوم، يتحقق التطبيق أن نيكست ذكرها كلها ويذكّره بما أسقطه.</div>
    <label>قفل Face ID</label>
    <div class="lock-row"><button class="pill" type="button" id="lockToggle">تفعيل قفل Face ID</button></div>
    <div class="check" id="lockStatus"></div>
    <div class="check" id="checkResult"></div>
    <div class="row">
      <button class="pill primary" value="save" id="saveBtn">حفظ</button>
      <button class="pill" type="button" id="testBtn">اختبار الـ Vault</button>
      <button class="pill" value="cancel" formnovalidate>إلغاء</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js?v=20261023c"></script>
</body>
</html>
